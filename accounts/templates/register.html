{% extends 'base.html' %}
{% block content %}

<!-- Topbar -->
<header class="flex items-center justify-between mb-6 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white px-6 py-4 rounded-xl shadow-lg">
  <h1 class="text-2xl font-bold">➕ {{title}}</h1>
</header>

<!-- Registration Form -->
<div class="bg-gradient-to-b from-white to-gray-50 dark:from-gray-800 dark:to-gray-900 p-8 rounded-2xl shadow-md border border-gray-100 dark:border-gray-700 max-w-lg mx-auto">
  <h2 class="text-xl font-semibold mb-6 text-gray-800 dark:text-white">📝 {{title}}</h2>

  <form method="POST" class="space-y-4">
    {% csrf_token %}

    <!-- Render all form fields with Tailwind styles from forms.py -->
    {{ form.as_p }}

    <!-- Submit -->
    <button type="submit"
      class="w-full py-3 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium shadow hover:from-indigo-700 hover:to-purple-700 transition">
      Save
    </button>
  </form>
</div>

{% endblock %}

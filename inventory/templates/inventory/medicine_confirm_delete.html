{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-2xl shadow border border-gray-200 dark:border-gray-700">
  <h2 class="text-xl font-semibold mb-4 text-gray-900 dark:text-gray-100">Delete Product</h2>
  <p class="mb-4 text-gray-700 dark:text-gray-300">
    Are you sure you want to delete 
    <strong class="text-red-600 dark:text-red-400">{{ medicine }}</strong>?
  </p>
  <form method="post" class="flex items-center gap-3">
    {% csrf_token %}
    <a href="{% url 'inventory:medicine_list' %}" 
       class="px-4 py-2 rounded-xl bg-gray-200 text-gray-800 hover:bg-gray-300 
              dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 transition">
      Cancel
    </a>
    <button type="submit"
            class="px-4 py-2 rounded-xl bg-red-600 text-white hover:bg-red-700 
                   focus:ring-2 focus:ring-red-400 transition">
      Delete
    </button>
  </form>
</div>
{% endblock %}
